name: ClubOS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/clubos_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke -w server
      - run: npm run smoke:render -w server

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Chrome and Firefox acceptance
        run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_FIREFOX: "1"
      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
